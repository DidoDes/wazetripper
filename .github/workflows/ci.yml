# Checks that need no Waze download and no hardware: packet byte layouts, the injected Java package
# compiling against Android, and lint for the build scripts. Nothing proprietary is fetched here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Packet checks (same test as scripts/framecheck.sh)
        run: |
          mkdir -p build/framecheck
          javac -nowarn -d build/framecheck \
            src/com/waze/wazetripper/TripperProtocol.java \
            src/test/com/waze/wazetripper/PacketsCheck.java
          java -cp build/framecheck com.waze.wazetripper.PacketsCheck

      - name: Compile the injected package against android-34 (Java 8, framework only)
        run: |
          JAR="$ANDROID_HOME/platforms/android-34/android.jar"
          if [ ! -f "$JAR" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" > /dev/null
          fi
          mkdir -p build/gen/cls
          javac -source 8 -target 8 -cp "$JAR" -nowarn -d build/gen/cls $(find src/com -name "*.java")

      - name: Python scripts compile
        run: python3 -m py_compile scripts/*.py patches/*.py

      - name: ShellCheck
        run: shellcheck -x -P scripts -S warning scripts/*.sh
